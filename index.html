<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda | CTG Chama Nativa - Esteio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --laranja: #EF8A2E;
    --laranja-escuro: #D6501F;
    --carvao: #211D1A;
    --texto: #3A322C;
    --texto-suave: #7A7168;
    --fundo: #FBF7F2;
    --cartao: #FFFFFF;
    --linha: #ECE4DA;
    --teal: #10545A;
    --hoje-bg: #FFF1E4;
    --raio: 14px;
    --sombra: 0 2px 10px rgba(33,29,26,0.06);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--fundo);
    color:var(--texto);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  /* ===== TOPO ===== */
  header.topo{
    background:linear-gradient(135deg, var(--laranja) 0%, var(--laranja-escuro) 100%);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px clamp(16px,4vw,40px);
    box-shadow:0 3px 14px rgba(196,70,10,0.25);
    position:sticky;
    top:0;
    z-index:20;
  }
  .topo-esquerda{
    display:flex;
    align-items:center;
    gap:16px;
    min-width:0;
  }
  .logo-slot{
    width:56px;
    height:56px;
    border-radius:50%;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    overflow:hidden;
    border:1px solid rgba(255,255,255,0.55);
    box-shadow:0 1px 4px rgba(0,0,0,0.18);
  }
  .logo-slot img{width:100%;height:100%;object-fit:contain;}
  .logo-slot span{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px;}
  .topo-titulo h1{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:clamp(22px,3vw,32px);
    letter-spacing:0.5px;
    margin:0;
    line-height:1.1;
  }
  .topo-titulo p{
    margin:2px 0 0;
    font-size:13px;
    opacity:0.85;
    font-weight:500;
  }
  .relogio{
    text-align:right;
    font-family:'Space Grotesk',sans-serif;
    flex-shrink:0;
  }
  .relogio .hora{
    font-size:clamp(20px,2.6vw,28px);
    font-weight:700;
    letter-spacing:1px;
  }
  .relogio .data{
    font-size:13px;
    opacity:0.88;
    text-transform:capitalize;
  }

  /* ===== ABAS DE MÊS ===== */
  nav.abas{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding:14px clamp(16px,4vw,40px) 0;
    background:var(--fundo);
    position:sticky;
    top:88px;
    z-index:15;
    scrollbar-width:thin;
  }
  nav.abas::-webkit-scrollbar{height:6px;}
  nav.abas::-webkit-scrollbar-thumb{background:var(--linha);border-radius:10px;}
  .aba{
    border:none;
    background:transparent;
    color:var(--texto-suave);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    padding:10px 16px;
    border-radius:10px 10px 0 0;
    cursor:pointer;
    white-space:nowrap;
    position:relative;
    transition:color .15s ease, background .15s ease;
  }
  .aba .contagem{
    display:inline-block;
    margin-left:6px;
    background:var(--linha);
    color:var(--texto-suave);
    font-size:11px;
    font-weight:700;
    border-radius:20px;
    padding:1px 7px;
  }
  .aba.ativa{
    color:var(--laranja-escuro);
    background:var(--cartao);
    box-shadow:var(--sombra);
  }
  .aba.ativa .contagem{background:var(--laranja);color:#fff;}
  .aba:hover:not(.ativa){color:var(--texto);}

  /* ===== CONTEÚDO ===== */
  main{
    flex:1;
    padding:20px clamp(16px,4vw,40px) 60px;
    max-width:1100px;
    width:100%;
    margin:0 auto;
  }

  .status-msg{
    text-align:center;
    color:var(--texto-suave);
    padding:60px 20px;
    font-size:15px;
  }
  .status-msg.erro{color:#B3261E;}

  .grupo-dia{margin-bottom:26px;}
  .grupo-dia .rotulo-dia{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin-bottom:10px;
    padding-left:2px;
  }
  .grupo-dia .rotulo-dia .num{
    font-family:'Space Grotesk',sans-serif;
    font-size:26px;
    font-weight:700;
    color:var(--carvao);
  }
  .grupo-dia .rotulo-dia .semana{
    font-size:13px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.6px;
    color:var(--texto-suave);
  }
  .grupo-dia.hoje .rotulo-dia .num{color:var(--laranja-escuro);}
  .grupo-dia.hoje .rotulo-dia .semana{color:var(--laranja);}
  .grupo-dia.hoje .rotulo-dia .semana::after{
    content:"HOJE";
    margin-left:8px;
    background:var(--laranja);
    color:#fff;
    padding:2px 8px;
    border-radius:20px;
    font-size:10px;
  }

  .evento{
    display:flex;
    gap:16px;
    background:var(--cartao);
    border:1px solid var(--linha);
    border-radius:var(--raio);
    padding:14px 18px;
    margin-bottom:8px;
    box-shadow:var(--sombra);
    align-items:flex-start;
  }
  .grupo-dia.hoje .evento{background:var(--hoje-bg);border-color:#F3C79B;}
  .evento .horario{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    color:var(--teal);
    font-size:15px;
    min-width:92px;
    flex-shrink:0;
  }
  .evento .conteudo{min-width:0;}
  .evento .titulo{
    font-weight:600;
    font-size:15.5px;
    color:var(--carvao);
    margin:0 0 2px;
  }
  .evento .departamento{
    display:inline-block;
    font-size:11.5px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.4px;
    color:var(--laranja-escuro);
    background:var(--hoje-bg);
    border-radius:20px;
    padding:2px 9px;
    margin:0 0 4px;
  }
  .evento .local{
    font-size:13px;
    color:var(--texto-suave);
    margin:0;
  }

  footer{
    text-align:center;
    font-size:12px;
    color:var(--texto-suave);
    padding:14px;
  }

  /* Modo TV: telas largas — texto maior, sem hover states */
  @media (min-width: 1600px){
    .evento .titulo{font-size:19px;}
    .evento .local{font-size:15px;}
    .evento .horario{font-size:19px;min-width:112px;}
    .grupo-dia .rotulo-dia .num{font-size:32px;}
  }

  @media (max-width: 480px){
    .topo-titulo p{display:none;}
    .relogio .data{display:none;}
    .evento{flex-direction:column;gap:4px;}
    .evento .horario{min-width:auto;}
  }
</style>
</head>
<body>

<header class="topo">
  <div class="topo-esquerda">
    <div class="logo-slot" id="logoSlot"><span>A</span></div>
    <div class="topo-titulo">
      <h1>Agenda</h1>
      <p id="subtitulo">CTG Chama Nativa &middot; Esteio</p>
    </div>
  </div>
  <div class="relogio">
    <div class="hora" id="relogioHora">--:--</div>
    <div class="data" id="relogioData">carregando...</div>
  </div>
</header>

<nav class="abas" id="abasMeses"></nav>

<main id="conteudo">
  <div class="status-msg">Carregando agenda...</div>
</main>

<footer>Agenda atualizada a cada 5 minutos &middot; <span id="ultimaAtualizacao"></span></footer>

<script>
/* =========================================================================
   CONFIGURAÇÃO
   =========================================================================
   1) SHEET_CSV_URLS: lista com o(s) link(s) "Publicar na web" (formato CSV)
      das abas da sua planilha do Google Sheets. Pode ter 1 ou mais links —
      todos são combinados na mesma agenda.
      Como gerar cada link: Google Sheets > Arquivo > Compartilhar >
      Publicar na web > no primeiro menu, selecione a ABA desejada (não
      "Documento inteiro") > no segundo menu, escolha "Valores separados
      por vírgula (.csv)" > Publicar. Repita para cada aba que quiser expor
      (ex: uma aba de lançamento manual + a aba de respostas do Forms) e
      cole todos os links na lista abaixo.

   2) Cada aba/fonte precisa ter estas colunas, com cabeçalho na primeira
      linha (a ordem das colunas não importa, só o nome):
        Data | Horário Início | Horário Término | Departamento | Evento | Observação
      - Data no formato DD/MM/AAAA (ex: 22/07/2026)
      - Horário Início e Horário Término no formato HH:MM (ex: 14:30).
        Horário Término é opcional.
      - Departamento: setor/departamento responsável (ex: Patronagem, Dança)
      - Evento: nome do compromisso/evento
      - Observação: informação adicional (opcional)
      Se a aba for gerada por um formulário (ex: formulario.html + Apps
      Script), nomeie os campos exatamente como acima para que os dados
      caiam nas colunas certas automaticamente.

   3) LOGO_URL: caminho da imagem do logo (ex: "logo.png", hospedado no
      mesmo repositório do GitHub).
   ========================================================================= */

  const SHEET_CSV_URLS = [
    "https://docs.google.com/spreadsheets/d/e/2PACX-1vQI8OIvskrOizeTXCxtFECVnzRM356tu9YhhjkJN3igevp8KD5oIXnbT5EoZHxsn71LfgDORhgxL68V/pub?output=csv",
    "https://docs.google.com/spreadsheets/d/e/2PACX-1vQHljbHuR4jnF3MkrEbrgc9HeH7_fm7TYHAMyEEyZ_AkkSwNFrETsrJMJF3Ea9zhwDgWeTZQt4-mo_i/pub?output=csv"
  ];
  const LOGO_URL = "https://raw.githubusercontent.com/CCN1989/Imagens/refs/heads/main/Logo%20PNG.png";
  const INTERVALO_ATUALIZACAO_MIN = 5;

  // Período de meses exibido nas abas (0=Janeiro ... 11=Dezembro).
  // Padrão: Julho a Dezembro. Para voltar a mostrar o ano todo, use 0 e 11.
  const MES_INICIAL = 6;  // Julho
  const MES_FINAL = 11;   // Dezembro

/* ========================================================================= */

  const MESES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  const DIAS_SEMANA = ["Domingo","Segunda-feira","Terça-feira","Quarta-feira","Quinta-feira","Sexta-feira","Sábado"];

  let eventosPorMes = {}; // { 0: [...], 1: [...] , ... }
  let mesAtivo = new Date().getMonth();
  if(mesAtivo < MES_INICIAL || mesAtivo > MES_FINAL){
    mesAtivo = MES_INICIAL;
  }

  if (LOGO_URL) {
    document.getElementById('logoSlot').innerHTML = `<img src="${LOGO_URL}" alt="logo">`;
  }

  function atualizarRelogio(){
    const agora = new Date();
    document.getElementById('relogioHora').textContent =
      agora.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
    document.getElementById('relogioData').textContent =
      agora.toLocaleDateString('pt-BR', {weekday:'long', day:'2-digit', month:'long'});
  }
  atualizarRelogio();
  setInterval(atualizarRelogio, 15000);

  function parseDataBR(str){
    // Aceita DD/MM/AAAA (padrão) e também AAAA-MM-DD (caso alguma fonte exporte em ISO)
    if(!str) return null;
    str = str.trim();
    if(str.includes('/')){
      const partes = str.split('/');
      if(partes.length < 3) return null;
      const dia = parseInt(partes[0],10);
      const mes = parseInt(partes[1],10)-1;
      const ano = parseInt(partes[2],10);
      if(isNaN(dia)||isNaN(mes)||isNaN(ano)) return null;
      return new Date(ano, mes, dia);
    }
    if(str.includes('-')){
      const partes = str.split('-');
      if(partes.length < 3) return null;
      const ano = parseInt(partes[0],10);
      const mes = parseInt(partes[1],10)-1;
      const dia = parseInt(partes[2],10);
      if(isNaN(dia)||isNaN(mes)||isNaN(ano)) return null;
      return new Date(ano, mes, dia);
    }
    return null;
  }

  function buscarCsv(url){
    return new Promise((resolve, reject) => {
      Papa.parse(url, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: (resultado) => resolve(resultado.data),
        error: (erro) => reject(erro)
      });
    });
  }

  function carregarAgenda(){
    const urls = (SHEET_CSV_URLS || []).map(u => (u||'').trim()).filter(Boolean);

    if(urls.length === 0 || urls.some(u => u.includes("COLE_AQUI"))){
      document.getElementById('conteudo').innerHTML =
        `<div class="status-msg erro">Configure os links das planilhas (SHEET_CSV_URLS) no início do arquivo index.html.</div>`;
      construirAbas();
      return;
    }

    if(urls.some(u => u.includes('/edit'))){
      document.getElementById('conteudo').innerHTML =
        `<div class="status-msg erro">Um dos links configurados parece ser o link normal de compartilhamento (contém "/edit"), e não o link publicado.<br>
        Vá em Google Sheets &rarr; Arquivo &rarr; Compartilhar &rarr; Publicar na web &rarr; escolha a aba &rarr; formato CSV, e use o link gerado ali.</div>`;
      construirAbas();
      return;
    }

    if(location.protocol === 'file:'){
      document.getElementById('conteudo').innerHTML =
        `<div class="status-msg erro">Esta página foi aberta diretamente do computador (file://), e por segurança o navegador bloqueia a busca da planilha nesse modo.<br>
        Publique a página no GitHub Pages (ou rode um servidor local) e acesse pelo link https:// para funcionar.</div>`;
      construirAbas();
      return;
    }

    Promise.all(urls.map(u => buscarCsv(u)))
      .then(resultados => {
        const todasAsLinhas = resultados.flat();
        processarLinhas(todasAsLinhas);
        construirAbas();
        renderizarMes(mesAtivo);
        document.getElementById('ultimaAtualizacao').textContent =
          "última verificação: " + new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
      })
      .catch(erro => {
        document.getElementById('conteudo').innerHTML =
          `<div class="status-msg erro">Não foi possível carregar uma das planilhas.<br>
          Causas mais comuns: (1) o link não é o link "publicado" em CSV, (2) a página está sendo aberta como arquivo local em vez de um site https://, ou (3) a aba não está publicada/compartilhada.<br>
          Detalhe técnico: ${erro}</div>`;
      });
  }

  function processarLinhas(linhas){
    eventosPorMes = {};
    linhas.forEach(linha => {
      const dataStr = linha['Data'] || linha['data'] || '';
      const data = parseDataBR(dataStr);
      if(!data) return;
      const mes = data.getMonth();
      if(!eventosPorMes[mes]) eventosPorMes[mes] = [];
      eventosPorMes[mes].push({
        data: data,
        horaInicio: (linha['Horário Início'] || linha['Horario Inicio'] || linha['Horário Inicio'] || linha['Horario Início'] || '').trim(),
        horaTermino: (linha['Horário Término'] || linha['Horario Termino'] || linha['Horário Termino'] || linha['Horario Término'] || '').trim(),
        departamento: (linha['Departamento'] || linha['departamento'] || '').trim(),
        evento: (linha['Evento'] || linha['evento'] || '(sem título)').trim(),
        observacao: (linha['Observação'] || linha['Observacao'] || linha['observação'] || linha['observacao'] || '').trim()
      });
    });
    // ordenar cada mês por data e depois horário de início
    Object.keys(eventosPorMes).forEach(mes => {
      eventosPorMes[mes].sort((a,b) => {
        if(a.data - b.data !== 0) return a.data - b.data;
        return (a.horaInicio||'').localeCompare(b.horaInicio||'');
      });
    });
  }

  function construirAbas(){
    const nav = document.getElementById('abasMeses');
    nav.innerHTML = '';
    MESES.forEach((nome, idx) => {
      if(idx < MES_INICIAL || idx > MES_FINAL) return;
      const qtd = (eventosPorMes[idx] || []).length;
      const btn = document.createElement('button');
      btn.className = 'aba' + (idx === mesAtivo ? ' ativa' : '');
      btn.innerHTML = nome + (qtd ? `<span class="contagem">${qtd}</span>` : '');
      btn.onclick = () => { mesAtivo = idx; construirAbas(); renderizarMes(idx); };
      nav.appendChild(btn);
    });
  }

  function renderizarMes(mes){
    const container = document.getElementById('conteudo');
    const eventos = eventosPorMes[mes] || [];

    if(eventos.length === 0){
      container.innerHTML = `<div class="status-msg">Nenhum compromisso cadastrado para ${MESES[mes]}.</div>`;
      return;
    }

    const hoje = new Date();
    const hojeStr = hoje.toDateString();

    // agrupar por dia
    const porDia = {};
    eventos.forEach(ev => {
      const chave = ev.data.toDateString();
      if(!porDia[chave]) porDia[chave] = [];
      porDia[chave].push(ev);
    });

    let html = '';
    Object.keys(porDia).forEach(chaveDia => {
      const listaDia = porDia[chaveDia];
      const dataRef = listaDia[0].data;
      const ehHoje = chaveDia === hojeStr;
      html += `<div class="grupo-dia ${ehHoje ? 'hoje' : ''}">
        <div class="rotulo-dia">
          <span class="num">${String(dataRef.getDate()).padStart(2,'0')}</span>
          <span class="semana">${DIAS_SEMANA[dataRef.getDay()]}</span>
        </div>`;
      listaDia.forEach(ev => {
        const faixaHorario = ev.horaInicio
          ? (ev.horaTermino ? `${ev.horaInicio}–${ev.horaTermino}` : ev.horaInicio)
          : '—';
        html += `<div class="evento">
          <div class="horario">${faixaHorario}</div>
          <div class="conteudo">
            <p class="titulo">${escapeHtml(ev.evento)}</p>
            ${ev.departamento ? `<p class="departamento">${escapeHtml(ev.departamento)}</p>` : ''}
            ${ev.observacao ? `<p class="local">${escapeHtml(ev.observacao)}</p>` : ''}
          </div>
        </div>`;
      });
      html += `</div>`;
    });

    container.innerHTML = html;
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  carregarAgenda();
  setInterval(carregarAgenda, INTERVALO_ATUALIZACAO_MIN * 60 * 1000);
</script>

</body>
</html>
